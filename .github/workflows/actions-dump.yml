name: Dump workflow status

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture recent workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?per_page=20" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps([{k:r.get(k) for k in ("id","name","head_sha","status","conclusion","event","run_number","created_at","updated_at","html_url")} for r in d.get("workflow_runs",[])], ensure_ascii=False, indent=2))' \
            > actions-runs.json
      - name: Commit status snapshot
        run: |
          git config user.name "tanem-actions-status"
          git config user.email "actions@users.noreply.github.com"
          git add actions-runs.json
          git diff --cached --quiet && exit 0
          git commit -m "Capture workflow status snapshot"
          git pull --rebase
          git push
