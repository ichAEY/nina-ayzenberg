name: Build and deploy Nina TANEM site

on:
  push:
    branches: [main]
    paths-ignore:
      - deploy-status.json
      - .github/workflows/deploy-monitor.yml
      - .github/workflows/repair-images.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout client
        uses: actions/checkout@v4
        with:
          path: customer

      - name: Validate client source
        shell: bash
        run: |
          set -euo pipefail
          test -f customer/master.png
          test -f customer/glavnaya.jpg
          test -f customer/site-data.mjs
          for n in {1..9}; do test -f "customer/$n.png"; done
          node --input-type=module <<'NODE'
          import site from './customer/site-data.mjs';
          const totalServices=(site.services?.manicure?.length||0)+(site.services?.pedicure?.length||0);
          if(site.master?.name!=='Нина') throw new Error('Wrong master');
          if(site.images?.gallery?.length!==9) throw new Error('Gallery must contain 9 images');
          if(totalServices!==10) throw new Error(`Expected 10 services, got ${totalServices}`);
          if(site.reputation?.rating!=='5,0'||site.reputation?.reviewCount!=='101') throw new Error('Reputation data is stale');
          if(!site.links?.bookingUrl) throw new Error('Booking URL missing');
          NODE

      - name: Checkout TANEM visual base
        uses: actions/checkout@v4
        with:
          repository: ichAEY/claytone-current
          ref: ce1bd42b44e76e1851af9e069c4cbcf06fc8eac2
          path: template

      - name: Checkout TANEM factory
        uses: actions/checkout@v4
        with:
          repository: ichAEY/tanem-master-template-v1
          ref: 2c3590bdb8d4163532d126d67f27be1469a426c5
          path: factory

      - name: Prepare client assets
        shell: bash
        run: |
          set -euo pipefail
          cp customer/site-data.mjs template/site-data.mjs
          cp customer/site-data.mjs factory/site-data.mjs
          mkdir -p template/public/assets/client/portfolio
          cp customer/glavnaya.jpg template/public/assets/client/glavnaya.jpg
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image, ImageFile
          from pathlib import Path
          ImageFile.LOAD_TRUNCATED_IMAGES=True

          def clean(src,dst):
              with Image.open(src) as im:
                  im.load()
                  if im.mode not in ('RGB','RGBA'):
                      im=im.convert('RGBA' if 'A' in im.getbands() else 'RGB')
                  Path(dst).parent.mkdir(parents=True,exist_ok=True)
                  im.save(dst,format='PNG',optimize=True)

          clean('customer/master.png','template/public/assets/client/master.png')
          for n in range(1,10):
              clean(f'customer/{n}.png',f'template/public/assets/client/portfolio/{n}.png')
          PY
          if [ -f customer/CNAME ]; then
            cp customer/CNAME template/public/CNAME
            echo "SITE_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "SITE_BASE_PATH=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"
          fi
          printf '%s\n' '// Booking uses the client phone link.' > template/public/noop.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: template/package-lock.json

      - name: Build TANEM site
        working-directory: template
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node scripts/generate-site.mjs
          node ../factory/scripts/apply-tanem-template.mjs
          node ../factory/scripts/apply-tanem-final.mjs
          node ../factory/scripts/apply-tanem-polish.mjs
          node ../factory/scripts/apply-tanem-tuning.mjs
          cat > next.config.ts <<'EOF'
          import type { NextConfig } from "next";
          const basePath=process.env.SITE_BASE_PATH||"";
          const nextConfig:NextConfig={output:"export",trailingSlash:true,images:{unoptimized:true},basePath};
          export default nextConfig;
          EOF
          if [ -n "$SITE_BASE_PATH" ]; then
            node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const p=process.env.SITE_BASE_PATH||'';
          const reps=[['/assets/',`${p}/assets/`],['/claytone-enhancements.js',`${p}/claytone-enhancements.js`],['/android-scroll-fix.js',`${p}/android-scroll-fix.js`],['/favicon.svg',`${p}/favicon.svg`],['/noop.js',`${p}/noop.js`]];
          const ok=new Set(['.tsx','.ts','.js','.mjs','.css','.html']);
          function walk(d){for(const e of fs.readdirSync(d,{withFileTypes:true})){const f=path.join(d,e.name);if(e.isDirectory())walk(f);else if(ok.has(path.extname(e.name))){let t=fs.readFileSync(f,'utf8'),b=t;for(const [a,z] of reps)t=t.split(a).join(z);if(t!==b)fs.writeFileSync(f,t)}}}
          for(const d of ['app','public'])if(fs.existsSync(d))walk(d);
          NODE
          fi
          rm -rf public/_next
          node - <<'NODE'
          const fs=require('fs');const p='tsconfig.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.exclude=[...(c.exclude||[]),'db/**','worker/**','examples/**','build/**','drizzle/**','drizzle.config.ts','vite.config.ts'];fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');
          NODE
          npx next build
          test -s out/index.html
          test -s out/assets/client/master.png
          test -s out/assets/client/glavnaya.jpg
          for n in {1..9}; do test -s "out/assets/client/portfolio/$n.png"; done

      - name: Browser QA
        working-directory: template
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          rm -rf preview
          mkdir -p "preview${SITE_BASE_PATH}"
          cp -a out/. "preview${SITE_BASE_PATH}/"
          python3 -m http.server 4173 --directory preview >/tmp/tanem-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          const base=process.env.SITE_BASE_PATH||'';
          const url=`http://127.0.0.1:4173${base}/`;
          const cases=[['desktop',1440,900],['laptop',1366,768],['mobile',390,844]];
          const browser=await chromium.launch({headless:true});
          const failures=[],report=[];
          for(const [name,width,height] of cases){
            const context=await browser.newContext({viewport:{width,height},deviceScaleFactor:1});
            const page=await context.newPage(),pageErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            await page.goto(url,{waitUntil:'networkidle'});
            await page.evaluate(()=>window.scrollTo(0,document.body.scrollHeight));
            await page.waitForTimeout(500);
            const s=await page.evaluate(()=>({width:document.documentElement.scrollWidth,viewport:innerWidth,height:document.documentElement.scrollHeight,brokenImages:[...document.images].filter(i=>!i.complete||i.naturalWidth===0).map(i=>i.currentSrc||i.src),text:document.body.innerText,works:document.querySelectorAll('.mct-work-tile').length}));
            if(s.width>s.viewport+2)failures.push(`${name}: horizontal overflow ${s.width}>${s.viewport}`);
            if(s.brokenImages.length)failures.push(`${name}: broken images ${s.brokenImages.join(', ')}`);
            for(const token of ['Нина','+7 985 777-26-36','Маникюр женский аппаратный','101'])if(!s.text.includes(token))failures.push(`${name}: missing ${token}`);
            if(!/1[\s\u00A0\u202F]*800[\s\u00A0\u202F]*₽/.test(s.text))failures.push(`${name}: first service price missing`);
            if(s.works<5)failures.push(`${name}: fewer than five portfolio works`);
            if(pageErrors.length)failures.push(`${name}: page errors ${pageErrors.join(' | ')}`);
            report.push({name,viewport:`${width}x${height}`,pageWidth:s.width,pageHeight:s.height,works:s.works,brokenImages:s.brokenImages,pageErrors});
            await page.evaluate(()=>window.scrollTo(0,0));
            await page.screenshot({path:`qa-${name}.png`,fullPage:true});
            await context.close();
          }
          await browser.close();
          fs.writeFileSync('qa-browser-report.json',JSON.stringify({failures,report},null,2));
          if(failures.length){console.error(failures.join('\n'));process.exit(1)}
          NODE

      - name: Upload visual QA
        uses: actions/upload-artifact@v4
        with:
          name: nina-visual-qa
          path: |
            template/qa-desktop.png
            template/qa-laptop.png
            template/qa-mobile.png
            template/qa-browser-report.json
          retention-days: 7

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: template/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
